<!--
title: @@TITLE@@
lede: What the form is for, and that nothing is sent if this is a demo.
meta: Form
date: today
-->

<section class="section">
  <h2>Details</h2>
  <div class="wizard" id="wizard">
    <ol class="stepper">
      <li aria-current="step"><span class="n">01</span>Details</li>
      <li><span class="n">02</span>Choice</li>
      <li><span class="n">03</span>Review</li>
    </ol>
    <div class="wizard-panel" data-panel="1">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" autocomplete="name" required aria-describedby="err-name">
        <p class="field-error" id="err-name" hidden>{{icon:x}}Enter your name.</p>
      </div>
    </div>
    <div class="wizard-panel" data-panel="2" hidden>
      <fieldset><legend>Choose one</legend><div class="radio-cards">
        <label class="choice" for="c1"><input type="radio" id="c1" name="choice" value="First option" checked><span>First option<span class="choice-hint">What it means.</span></span></label>
        <label class="choice" for="c2"><input type="radio" id="c2" name="choice" value="Second option"><span>Second option<span class="choice-hint">What it means.</span></span></label>
      </div></fieldset>
    </div>
    <div class="wizard-panel" data-panel="3" hidden>
      <dl class="specimens">
        <div class="specimen"><dt>Name</dt><dd id="r-name"></dd></div>
        <div class="specimen"><dt>Choice</dt><dd id="r-choice"></dd></div>
      </dl>
    </div>
    <div class="btn-row wizard-actions">
      <button type="button" class="btn btn-secondary" data-step-back>Back</button>
      <button type="button" class="btn btn-primary" data-step-next data-finish="Finish">Next</button>
    </div>
  </div>
</section>

<script>
$('#wizard').addEventListener('stepchange', e => {
  if (e.detail !== 3) return;
  $('#r-name').textContent = $('#name').value;
  $('#r-choice').textContent = $('input[name="choice"]:checked').value;
});
$('#wizard').addEventListener('finish', () => toast('Done. Nothing was sent.'));
</script>
