<section class="section">
  <h2>Calculator</h2>
  <div class="split wide">
    <div class="split-controls">
      <div class="field"><label for="a">First input</label><input type="text" id="a" value="1200" inputmode="decimal"></div>
      <div class="field"><label for="b">Second input</label><input type="text" id="b" value="12" inputmode="decimal"></div>
    </div>
    <div class="split-output" aria-live="polite">
      <p class="spaced-label">Result</p>
      <p class="big-number"><span id="result">—</span><span class="unit"> unit</span></p>
    </div>
  </div>
</section>

<section class="section">
  <h2>How it works</h2>
  <p>The formula in a sentence, and any assumptions.</p>
</section>

<script>
const calc = () => {
  const r = Number($('#a').value) / Math.max(1, Number($('#b').value));
  $('#result').textContent = Number.isFinite(r) ? r.toFixed(2) : '—';
};
$$('#a, #b').forEach(el => el.addEventListener('input', calc));
calc();
</script>
